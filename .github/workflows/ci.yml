name: CI - Docker y GHCR

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Definir nombres y tags
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=ghcr.io/$REPO" >> $GITHUB_ENV
          echo "HUB_IMAGE=${{ vars.DOCKERHUB_USERNAME }}/dds-devops-demo" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Construir imagen (una sola vez)
        run: docker build -t local-image .

      - name: Validar imagen
        run: |
          docker run -d -p 8080:80 --name test local-image
          sleep 3
          curl -f http://localhost:8080 | grep "Hola DevOps"
          docker rm -f test

      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login en Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ vars.DOCKERHUB_USERNAME }} --password-stdin

      - name: Etiquetar y publicar en ambos registros
        run: |
          for IMG in $GHCR_IMAGE $HUB_IMAGE; do
            docker tag local-image $IMG:latest
            docker tag local-image $IMG:$SHORT_SHA
            docker push $IMG:latest
            docker push $IMG:$SHORT_SHA
          done